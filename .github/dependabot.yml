version: 2

multi-ecosystem-groups:
  application-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Qyzylorda

updates:
  - package-ecosystem: gradle
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: application-dependencies

  - package-ecosystem: github-actions
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: application-dependencies
