name: Android CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_LABEL: "${{ github.event_name == 'pull_request' && format('PR-{0}', github.event.pull_request.number) || format('master-{0}', github.run_number) }}"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          --stacktrace

      - name: Prepare APK artifact
        run: >-
          cp app/build/outputs/apk/debug/app-debug.apk
          "$RUNNER_TEMP/SportOSS-${BUILD_LABEL}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "SportOSS-${{ env.BUILD_LABEL }}-debug"
          path: "${{ runner.temp }}/SportOSS-${{ env.BUILD_LABEL }}-debug.apk"
          if-no-files-found: error
          retention-days: 14
