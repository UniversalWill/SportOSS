name: Android CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_LABEL: "${{ github.event_name == 'pull_request' && format('PR-{0}', github.event.pull_request.number) || format('master-{0}', github.run_number) }}"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          --stacktrace

      - name: Prepare APK artifact
        run: >-
          cp app/build/outputs/apk/debug/app-debug.apk
          "$RUNNER_TEMP/SportOSS-${BUILD_LABEL}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "SportOSS-${{ env.BUILD_LABEL }}-debug"
          path: "${{ runner.temp }}/SportOSS-${{ env.BUILD_LABEL }}-debug.apk"
          if-no-files-found: error
          retention-days: 14
